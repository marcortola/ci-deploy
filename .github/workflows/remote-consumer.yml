name: Remote consumption

# Runs the published actions the way a consumer does: fetched from GitHub by full commit SHA, not
# from this checkout. The pin is the newest commit that changed an action or its scripts; bump it
# in the same pull request whenever one does, together with test/fixtures/revision-consumer (the
# release procedure in docs/releasing.md). CI's script/check-remote-pin fails while it is stale.
# Kamal is replaced by test/remote/kamal, which records its calls, so the scenarios check the
# action wiring: one version, outputs, rollback, cleanup and reporting after a failure, the
# re-raised result, and setup reporting its own failure to a local stand-in for Rollbar.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: remote-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: success
            fail: ""
          - scenario: deploy-failure
            fail: deploy
          - scenario: build-failure
            fail: build
    steps:
      - uses: marcortola/ci-deploy/setup@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        with:
          project-directory: test/fixtures/consumer
          vars: '{"WEB_SERVER_IPS":"192.0.2.10,192.0.2.11","DATABASE_SERVER_IPS":"192.0.2.30"}'
          secrets: '{"REGISTRY_PASSWORD":"first line\nsecond line"}'

      - name: Render the configuration with the locked Kamal
        working-directory: test/fixtures/consumer
        run: |
          kamal version | tee "$RUNNER_TEMP/kamal-version"
          grep -qx '2.10.0' "$RUNNER_TEMP/kamal-version"
          kamal config -c etc/kamal/deploy.yml > "$RUNNER_TEMP/config.yml"
          grep -q '192.0.2.11' "$RUNNER_TEMP/config.yml"
          test "$(printf '%s' "$REGISTRY_PASSWORD" | wc -l)" -eq 1

      - name: Put the recording Kamal first on PATH
        run: |
          echo "$GITHUB_WORKSPACE/test/remote" >> "$GITHUB_PATH"
          echo "FAKE_KAMAL_LOG=$RUNNER_TEMP/kamal.log" >> "$GITHUB_ENV"

      - uses: marcortola/ci-deploy/deploy@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        id: deploy
        continue-on-error: true
        env:
          FAKE_KAMAL_FAIL: ${{ matrix.fail }}
          FAKE_KAMAL_SERVING: v0-serving
        with:
          destination: staging
          rollback: auto
          cleanup-command: kamal cleanup-marker

      - name: Check the outcome
        env:
          SCENARIO: ${{ matrix.scenario }}
          OUTCOME: ${{ steps.deploy.outcome }}
          VERSION: ${{ steps.deploy.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.deploy.outputs.previous-version }}
          DEPLOY_RESULT: ${{ steps.deploy.outputs.deploy-result }}
          ROLLBACK_RESULT: ${{ steps.deploy.outputs.rollback-result }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          cat "$FAKE_KAMAL_LOG"
          sh test/remote/assert.sh

  operations:
    name: Operations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: marcortola/ci-deploy/setup@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        with:
          project-directory: test/fixtures/consumer
          vars: '{"WEB_SERVER_IPS":"192.0.2.10","DATABASE_SERVER_IPS":"192.0.2.30"}'

      - name: Put the recording Kamal first on PATH
        run: |
          echo "$GITHUB_WORKSPACE/test/remote" >> "$GITHUB_PATH"
          echo "FAKE_KAMAL_LOG=$RUNNER_TEMP/kamal.log" >> "$GITHUB_ENV"

      - uses: marcortola/ci-deploy/operations@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        with:
          operation: kamal
          args: app exec --reuse "echo 'semi;colon' $(id -u) | wc -c"
          destination: staging

      - uses: marcortola/ci-deploy/operations@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        id: untargeted
        continue-on-error: true
        with:
          operation: proxy-reboot
          destination: staging

      - uses: marcortola/ci-deploy/operations@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        with:
          operation: proxy-reboot
          hosts: 192.0.2.10
          destination: staging

      - name: Check the recorded calls
        env:
          UNTARGETED: ${{ steps.untargeted.outcome }}
        run: |
          cat "$FAKE_KAMAL_LOG"
          calls=$(awk '/^--- call$/ { if (n) print line; line = ""; n = 1; next } { line = line == "" ? $0 : line "|" $0 } END { if (n) print line }' "$FAKE_KAMAL_LOG")
          printf '%s\n' "$calls" | grep -Fxq "app|exec|--reuse|echo 'semi;colon' \$(id -u) | wc -c|-c|etc/kamal/deploy.yml|-d|staging"
          test "$UNTARGETED" = failure
          test "$(printf '%s\n' "$calls" | grep -c '^proxy|reboot')" -eq 1
          printf '%s\n' "$calls" | grep -Fxq "proxy|reboot|-y|--hosts=192.0.2.10|-c|etc/kamal/deploy.yml|-d|staging"

  setup-failure:
    name: Setup failure (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fails in its first step after checkout, before Ruby is set up or anything is exported.
          - scenario: early
            project-directory: test/fixtures/missing
            outputs-map: ""
            report-destination: staging
          # Fails at the Terraform lookup (no token), after Ruby and the export.
          - scenario: late
            project-directory: test/fixtures/consumer
            outputs-map: WEB_SERVER_IPS=web_server_ips
            report-destination: staging
          - scenario: silent
            project-directory: test/fixtures/missing
            outputs-map: ""
            report-destination: ""
    steps:
      # A local stand-in for Rollbar that records each request, one JSON line each.
      - name: Start a recording Rollbar
        run: |
          cat > "$RUNNER_TEMP/rollbar.py" <<'PY'
          import http.server, json, sys
          log = open(sys.argv[1], "a", buffering=1)
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  log.write(json.dumps({"path": self.path, "token": self.headers.get("X-Rollbar-Access-Token"), "body": json.loads(body)}) + "\n")
                  self.send_response(200)
                  self.send_header("Content-Length", "2")
                  self.end_headers()
                  self.wfile.write(b"{}")
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 18765), Handler).serve_forever()
          PY
          touch "$RUNNER_TEMP/rollbar.log"
          nohup python3 "$RUNNER_TEMP/rollbar.py" "$RUNNER_TEMP/rollbar.log" > /dev/null 2>&1 &
          for _ in $(seq 50); do (exec 3<>/dev/tcp/127.0.0.1/18765) 2>/dev/null && break; sleep 0.2; done
          (exec 3<>/dev/tcp/127.0.0.1/18765)
          echo "CI_DEPLOY_ROLLBAR_ENDPOINT=http://127.0.0.1:18765" >> "$GITHUB_ENV"

      - uses: marcortola/ci-deploy/setup@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        id: setup
        continue-on-error: true
        with:
          project-directory: ${{ matrix.project-directory }}
          vars: '{"WEB_SERVER_IPS":"192.0.2.10","DATABASE_SERVER_IPS":"192.0.2.30"}'
          secrets: '{"ROLLBAR_SERVER_TOKEN":"remote-fake-token"}'
          outputs-map: ${{ matrix.outputs-map }}
          report-destination: ${{ matrix.report-destination }}

      - name: Check the report
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          REPORTED: ${{ matrix.report-destination != '' }}
          LOG: ${{ runner.temp }}/rollbar.log
        run: |
          cat "$LOG"
          test "$OUTCOME" = failure
          if [ "$REPORTED" = true ]; then
            jq -es 'length == 2' "$LOG"
            jq -es '.[0] | .path == "/api/1/deploy" and .token == "remote-fake-token" and .body.status == "failed" and .body.environment == "staging"' "$LOG"
            jq -es '.[1] | .path == "/api/1/item/" and .body.access_token == "remote-fake-token" and .body.data.level == "critical" and (.body.data.body.message.body | contains("setup-failed"))' "$LOG"
          else
            test ! -s "$LOG"
          fi

  revision-check:
    name: Revision check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This repository's own docs and tests reference it, so the check runs on a synthetic
      # consumer pinned to the same commit.
      - uses: marcortola/ci-deploy/revision-check@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        with:
          component: test/fixtures/revision-consumer
