name: ci-deploy revision-check
description: >-
  Fails unless the component references marcortola/ci-deploy (owner and name in any case) only
  from top-level workflows, all pinned to one full commit SHA with agreeing release comments, and
  this check itself runs at that SHA. Every file git knows about in the component (tracked, or
  untracked and not ignored) is scanned, so the component must be a git checkout.

inputs:
  component:
    description: Component directory, relative to the workspace.
    required: false
    default: "."
  workflows:
    description: Workflows directory, relative to the component.
    required: false
    default: .github/workflows
  own-ref:
    description: >-
      Revision this check must match. Empty derives it from where the runner fetched this action
      (_actions/marcortola/ci-deploy/<ref>), so the check verifies its own pin.
    required: false
    default: ""
  setup-ruby:
    description: Install Ruby 3.3 first ('false' uses the Ruby already on PATH, 3.0 or later).
    required: false
    default: "true"

outputs:
  sha:
    description: The single pinned revision.
    value: ${{ steps.check.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Set up Ruby
      if: inputs.setup-ruby == 'true'
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: "3.3"

    - id: check
      name: Check the ci-deploy revision
      shell: bash
      env:
        CI_DEPLOY_IN_COMPONENT: ${{ inputs.component }}
        CI_DEPLOY_IN_WORKFLOWS: ${{ inputs.workflows }}
        CI_DEPLOY_IN_OWN_REF: ${{ inputs.own-ref }}
        CI_DEPLOY_ACTION_HOME: ${{ github.action_path }}/..
      run: |
        cd "$GITHUB_WORKSPACE"
        ruby "$GITHUB_ACTION_PATH/../bin/ci-deploy" revision-check
