name: ci-deploy setup
description: >-
  Checks out the component at the workflow's commit, prepares Ruby and the locked Kamal bundle from
  this repository, loads the SSH key, exports variables, secrets and Terraform outputs, and copies
  the Kamal secrets file. Run it before the deploy or operations action, pinned to the same SHA.
  For the rest of the job it sets up Ruby 3.3, puts this revision's bin/ first on PATH and exports
  BUNDLE_GEMFILE (this revision's Gemfile), RUBYLIB (its lib/), CI_DEPLOY_HOME,
  CI_DEPLOY_HOOKS_LIB, CI_DEPLOY_PROJECT_DIR and CI_DEPLOY_CONFIG: later steps that run Ruby or
  Bundler for the component's own purposes must set their own BUNDLE_GEMFILE. Given the deploy's
  destination (report-destination), a failure of any of its steps is reported to Rollbar as a
  failed deploy.

inputs:
  checkout:
    description: "Check out the repository first ('true' or 'false')."
    required: false
    default: "true"
  project-directory:
    description: Directory holding the Kamal configuration, relative to the workspace. Kamal runs here.
    required: false
    default: "."
  config:
    description: Kamal configuration file, relative to the project directory.
    required: false
    default: etc/kamal/deploy.yml
  secrets-file:
    description: Kamal secrets file, relative to the project directory, copied to .kamal/ under its own name. Empty skips it.
    required: false
    default: etc/kamal/secrets-common
  vars:
    description: The workflow's variables as JSON (toJSON(vars)), exported under their own names.
    required: false
    default: ""
  secrets:
    description: The workflow's secrets as JSON (toJSON(secrets)), exported under their own names and masked.
    required: false
    default: ""
  outputs-map:
    description: >-
      Terraform outputs to export, one NAME=output per line. NAME=output[0] takes the first element;
      a trailing ? makes the output optional. Lists are exported comma-separated.
    required: false
    default: ""
  terraform-token:
    description: HCP Terraform API token, required with an outputs map.
    required: false
    default: ""
  terraform-workspace:
    description: HCP Terraform workspace id (ws-...), required with an outputs map.
    required: false
    default: ""
  terraform-address:
    description: Terraform API address; empty uses https://app.terraform.io.
    required: false
    default: ""
  ssh-private-key:
    description: SSH private key loaded into an agent for Kamal. Empty skips the agent.
    required: false
    default: ""
  registry:
    description: Registry server, exported as REGISTRY when set.
    required: false
    default: ""
  registry-user:
    description: Registry user, exported as REGISTRY_USER when set.
    required: false
    default: ""
  registry-password:
    description: Registry password, exported (masked) as REGISTRY_PASSWORD when set.
    required: false
    default: ""
  ssh-user:
    description: SSH user, exported as SSH_USER when set.
    required: false
    default: ""
  ssh-port:
    description: SSH port, exported as SSH_PORT when set.
    required: false
    default: ""
  report-destination:
    description: >-
      The destination the job deploys: pass the deploy action's destination. When a setup step
      fails, GitHub skips the deploy action and its Rollbar reporting, so setup then reports a
      failed deploy (result setup-failed) and raises the critical item itself. Empty, with
      report-environment-name also empty, reports nothing: leave both empty in operations jobs and
      configuration checks.
    required: false
    default: ""
  report-environment-name:
    description: >-
      Environment a setup failure is reported under; empty uses report-destination. Pass the deploy
      action's environment-name when it sets one, or production for a configuration without
      destinations.
    required: false
    default: ""
  rollbar-token:
    description: >-
      Rollbar server token for a setup failure report. Empty falls back to ROLLBAR_TOKEN,
      ROLLBAR_SERVER_TOKEN, ROLLBAR_ACCESS_TOKEN or LOG_ROLLBAR_ACCESS_TOKEN in the secrets input,
      then in the environment; none skips reporting.
    required: false
    default: ""

outputs:
  home:
    description: Directory of this repository at the pinned revision.
    value: ${{ steps.paths.outputs.home }}
  project-directory:
    description: Absolute project directory.
    value: ${{ steps.paths.outputs.project-directory }}

runs:
  using: composite
  steps:
    - name: Check out the repository
      if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Point the job at this revision's tooling
      id: paths
      shell: bash
      env:
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        CONFIG: ${{ inputs.config }}
      run: sh "$GITHUB_ACTION_PATH/../lib/sh/setup-paths.sh"

    - name: Set up Ruby and the locked Kamal bundle
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        working-directory: ${{ github.action_path }}/..
        bundler-cache: true

    - name: Load the SSH key
      if: inputs.ssh-private-key != ''
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Export variables and secrets
      shell: bash
      env:
        CI_DEPLOY_IN_VARS: ${{ inputs.vars }}
        CI_DEPLOY_IN_SECRETS: ${{ inputs.secrets }}
      run: ruby "$CI_DEPLOY_HOME/bin/ci-deploy" export-env

    - name: Export registry and SSH settings
      shell: bash
      env:
        CI_DEPLOY_IN_REGISTRY: ${{ inputs.registry }}
        CI_DEPLOY_IN_REGISTRY_USER: ${{ inputs.registry-user }}
        CI_DEPLOY_IN_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        CI_DEPLOY_IN_SSH_USER: ${{ inputs.ssh-user }}
        CI_DEPLOY_IN_SSH_PORT: ${{ inputs.ssh-port }}
      run: ruby "$CI_DEPLOY_HOME/bin/ci-deploy" kamal-env

    - name: Export Terraform outputs
      if: inputs.outputs-map != ''
      shell: bash
      env:
        CI_DEPLOY_IN_OUTPUTS_MAP: ${{ inputs.outputs-map }}
        CI_DEPLOY_IN_TERRAFORM_TOKEN: ${{ inputs.terraform-token }}
        CI_DEPLOY_IN_TERRAFORM_WORKSPACE: ${{ inputs.terraform-workspace }}
        CI_DEPLOY_IN_TERRAFORM_ADDRESS: ${{ inputs.terraform-address }}
      run: ruby "$CI_DEPLOY_HOME/bin/ci-deploy" terraform-outputs

    - name: Copy the Kamal secrets file
      if: inputs.secrets-file != ''
      shell: bash
      env:
        CI_DEPLOY_IN_SECRETS_FILE: ${{ inputs.secrets-file }}
      run: ruby "$CI_DEPLOY_HOME/bin/ci-deploy" prepare-secrets

    # Last, and only after a failed step of this action: the deploy action and its reporting are
    # skipped then. Standard library only, so it runs on the runner's own Ruby when Ruby setup
    # failed; continue-on-error keeps a reporting problem from adding a failure of its own.
    - name: Report a setup failure
      if: failure() && (inputs.report-destination != '' || inputs.report-environment-name != '')
      continue-on-error: true
      shell: bash
      env:
        CI_DEPLOY_IN_REPORT_DESTINATION: ${{ inputs.report-destination }}
        CI_DEPLOY_IN_REPORT_ENVIRONMENT_NAME: ${{ inputs.report-environment-name }}
        CI_DEPLOY_IN_ROLLBAR_TOKEN: ${{ inputs.rollbar-token }}
        CI_DEPLOY_IN_SECRETS: ${{ inputs.secrets }}
      run: ruby "$GITHUB_ACTION_PATH/../bin/ci-deploy" report-setup-failure
