# Synthetic consumer for the remote revision-check job: pinned to the same commit as
# .github/workflows/remote-consumer.yml, and re-pinned with it (docs/releasing.md).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: marcortola/ci-deploy/setup@9446291615d40a1dacdef9daa7c8725cfdcd36cb # allow-main-to-staging
      - uses: marcortola/ci-deploy/deploy@9446291615d40a1dacdef9daa7c8725cfdcd36cb # allow-main-to-staging
        with:
          rollback: auto
