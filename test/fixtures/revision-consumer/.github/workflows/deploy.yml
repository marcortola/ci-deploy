# Synthetic consumer for the remote revision-check job: pinned to the same commit as
# .github/workflows/remote-consumer.yml, and re-pinned with it (docs/releasing.md).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: marcortola/ci-deploy/setup@db5559d72d30aac74ffca5fa3b80af88df45b563 # feat-push-env-before-deploy
      - uses: marcortola/ci-deploy/deploy@db5559d72d30aac74ffca5fa3b80af88df45b563 # feat-push-env-before-deploy
        with:
          rollback: auto
