# Synthetic consumer for the remote revision-check job: pinned to the same commit as
# .github/workflows/remote-consumer.yml, and re-pinned with it (docs/releasing.md).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: marcortola/ci-deploy/setup@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
      - uses: marcortola/ci-deploy/deploy@3d9daebddb8e2db84f0d8320cbd4e2a1f290b2d4 # fix-pre-v1
        with:
          rollback: auto
