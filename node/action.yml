name: ci-deploy node
description: Sets up Node.js with the package manager's download cache and installs the locked dependencies.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "22"
  package-manager:
    description: npm, yarn or pnpm (pnpm through corepack).
    required: false
    default: npm
  working-directory:
    description: Directory holding package.json and the lockfile.
    required: false
    default: "."
  install:
    description: Install the locked dependencies ('true' or 'false').
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Check the inputs
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        case "$PACKAGE_MANAGER" in
          npm|yarn|pnpm) ;;
          *) echo "::error::package-manager must be npm, yarn or pnpm, not '$PACKAGE_MANAGER'"; exit 1 ;;
        esac

    - name: Enable corepack for pnpm
      if: inputs.package-manager == 'pnpm'
      shell: bash
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'npm' && 'package-lock.json' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'pnpm-lock.yaml' }}

    - name: Install the locked dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        case "$PACKAGE_MANAGER" in
          npm) npm ci ;;
          yarn) yarn install --frozen-lockfile ;;
          pnpm) pnpm install --frozen-lockfile ;;
        esac
