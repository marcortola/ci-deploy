# Integration app b. Hosts come from the environment as the setup action exports them.
<% require "ci_deploy/hosts" if ENV["IT_LEGACY"].to_s.empty? %>
service: it-app-b
image: it/app-b

servers:
  web:
    hosts: <%= (ENV["IT_LEGACY"].to_s.empty? ? CiDeploy::Hosts.list("APP_B_HOSTS") : ENV.fetch("APP_B_HOSTS").split(",")).to_json %>

proxy:
  host: b.example.test
  app_port: 3000
  healthcheck:
    interval: 1
    timeout: 2

deploy_timeout: 15
drain_timeout: 2

env:
  clear:
    APP_NAME: app-b

registry:
  server: 127.0.0.1:55000
  username: it
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  port: 2222
  keys_only: true
  keys:
    - <%= ENV.fetch("IT_SSH_KEY") %>

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile
<% if ENV["IT_LEGACY"].to_s.empty? %>
  driver: docker
  args:
    FAIL_BUILD: <%= ENV.fetch("IT_FAIL_BUILD", "0") %>
    HEALTH: <%= ENV.fetch("IT_HEALTH", "ok") %>
<% end %>
