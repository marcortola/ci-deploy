# Synthetic consumer for the remote revision-check job: pinned to the same commit as
# .github/workflows/remote-consumer.yml, and re-pinned with it (docs/releasing.md).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: marcortola/ci-deploy/setup@96605db5d2b80b2be62c2f2d4d298f52bb79a15d # fix-pre-v1
      - uses: marcortola/ci-deploy/deploy@96605db5d2b80b2be62c2f2d4d298f52bb79a15d # fix-pre-v1
        with:
          rollback: auto
