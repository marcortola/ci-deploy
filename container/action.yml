name: ci-deploy container
description: >-
  Builds a container image with Buildx, runs smoke commands inside it and optionally publishes it.
  Smoke commands are interpreted by the image's shell, never by the runner's.

inputs:
  tags:
    description: Image tags, one per line; smoke commands run the first.
    required: true
  context:
    description: Build context.
    required: false
    default: "."
  file:
    description: Dockerfile path; empty uses the context's Dockerfile.
    required: false
    default: ""
  target:
    description: Target stage; empty builds the last.
    required: false
    default: ""
  build-args:
    description: Build arguments, one per line, NAME (value from the environment) or NAME=value.
    required: false
    default: ""
  secrets:
    description: Buildx secret specs, one per line (id=name,src=path or id=name,env=VAR).
    required: false
    default: ""
  labels:
    description: Image labels, one per line, NAME=value.
    required: false
    default: ""
  cache:
    description: gha (GitHub Actions cache) or none.
    required: false
    default: gha
  smoke-commands:
    description: Commands run inside the built image, one per line, each with sh -c.
    required: false
    default: ""
  smoke-run-args:
    description: docker run options for the smoke commands, separated by spaces (e.g. --network host --env-file .env.example).
    required: false
    default: ""
  push:
    description: Publish every tag after the smoke commands pass ('true' or 'false').
    required: false
    default: "false"
  registry:
    description: Registry to log in to before publishing.
    required: false
    default: ""
  registry-user:
    description: Registry user; empty skips the login.
    required: false
    default: ""
  registry-password:
    description: Registry password.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Expose the GitHub runtime for the build cache
      if: inputs.cache == 'gha'
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

    - name: Build, smoke-test and publish
      shell: bash
      env:
        IMAGE_TAGS: ${{ inputs.tags }}
        BUILD_CONTEXT: ${{ inputs.context }}
        BUILD_FILE: ${{ inputs.file }}
        BUILD_TARGET: ${{ inputs.target }}
        BUILD_ARGS: ${{ inputs.build-args }}
        BUILD_SECRETS: ${{ inputs.secrets }}
        BUILD_LABELS: ${{ inputs.labels }}
        BUILD_CACHE: ${{ inputs.cache }}
        SMOKE_COMMANDS: ${{ inputs.smoke-commands }}
        SMOKE_RUN_ARGS: ${{ inputs.smoke-run-args }}
        PUSH: ${{ inputs.push }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: bash "$GITHUB_ACTION_PATH/../lib/sh/container-build.sh"
