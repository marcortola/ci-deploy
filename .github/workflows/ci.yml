name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit suite and config render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install the locked bundle
        run: |
          nix develop --command sh -c '
            bundle config set --local path vendor/bundle &&
            bundle config set --local frozen true &&
            bundle install --jobs 4'

      - name: ShellCheck and actionlint
        run: nix develop --command script/lint

      - name: Unit suite (includes the Kamal config render)
        run: nix develop --command script/test
