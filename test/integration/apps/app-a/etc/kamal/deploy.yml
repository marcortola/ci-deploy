# Integration app a. Hosts come from the environment as the setup action exports them.
<% require "ci_deploy/hosts" if ENV["IT_LEGACY"].to_s.empty? %>
service: it-app-a
image: it/app-a

servers:
  web:
    hosts: <%= (ENV["IT_LEGACY"].to_s.empty? ? CiDeploy::Hosts.list("APP_A_HOSTS") : ENV.fetch("APP_A_HOSTS").split(",")).to_json %>

proxy:
  host: a.example.test
  app_port: 3000
  healthcheck:
    interval: 1
    timeout: 2

deploy_timeout: 15
drain_timeout: 2

env:
  clear:
    APP_NAME: app-a

registry:
  server: 127.0.0.1:55000
  username: it
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  port: 2222
  keys_only: true
  keys:
    - <%= ENV.fetch("IT_SSH_KEY") %>

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile
<% if ENV["IT_LEGACY"].to_s.empty? %>
  driver: docker
  args:
    FAIL_BUILD: <%= ENV.fetch("IT_FAIL_BUILD", "0") %>
    HEALTH: <%= ENV.fetch("IT_HEALTH", "ok") %>
<% end %>
<% if ENV["IT_LEGACY"].to_s.empty? %>
accessories:
  store:
    image: busybox:1.36
    host: <%= CiDeploy::Hosts.first("APP_A_HOSTS") %>
    cmd: sh -c 'mkdir -p /data && { [ -f /data/marker ] || date +%s%N > /data/marker; } && exec sleep 86400'
    volumes:
      - /var/lib/it-store:/data
<% end %>
